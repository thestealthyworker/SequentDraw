# A CI-only compose file. Every relationship below is FALSE for the real
# application: the producer never touches the database and the reader
# never touches redis. Scanning this file is what leaked false facts into
# the example-voting-app bundle (CTO-M1-05).
services:
  sut:
    image: example/queue-pipeline-tests
    depends_on:
      - producer
      - reader
  producer:
    image: example/queue-pipeline-producer
    depends_on:
      - redis
      - db
  reader:
    image: example/queue-pipeline-reader
    depends_on:
      - redis
      - db
  redis:
    image: redis:7
  db:
    image: postgres:16
