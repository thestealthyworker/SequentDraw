name: skill-evals

# `pull_request`, never `pull_request_target` -- see
# docs/design/skills-and-plugin.md, "CI": a PR from a fork must never
# receive CLAUDE_CODE_OAUTH_TOKEN, and pull_request (unlike
# pull_request_target) runs with the fork's own read-only, secret-less
# token by default. The job below additionally no-ops when the secret is
# absent, which is exactly the fork-PR case.
on:
  # `labeled` is here so adding the run-evals label to an already-open PR
  # (see the opt-in below) starts a run without needing a new commit. The
  # existing `paths` filter is unchanged -- it still applies to a `labeled`
  # event the same way it does to any other, from the diff against the base
  # branch.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "skills/**"
      - ".agents/skills/**"
      - "evals/**"
      - "hooks/**"
      - ".claude-plugin/**"
      - "bin/**"
      - "src/**"
      - "schema/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/select-eval-tags.js"
      - "scripts/eval-results-guard.js"
      - ".github/workflows/skill-evals.yml"
  # A full-suite run with no PR at all -- the final-review run, or a manual
  # re-run after a plan limit resets. No inputs: it always runs everything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-evals:
    runs-on: ubuntu-latest
    # A `labeled` event fires for every label added to a matching PR, not
    # just `run-evals` (someone tagging a PR "needs-design" would otherwise
    # start a paid run). Skip the whole job for that case rather than
    # threading the check through every later step -- simpler to reason
    # about, and it costs nothing since no step below has run yet.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'run-evals'
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The case selection below diffs this PR against its base branch.
          fetch-depth: 0

      - name: Skip gracefully when the eval credential is unavailable (fork PRs)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: |
          echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set (expected for a fork PR)."
          echo "::notice::Skipping skill evals -- they require the owner's Claude subscription credential."

      # A token pasted with a stray space, newline or decorative character from
      # the terminal fails deep inside the eval runs ("Invalid Authorization
      # header value ... non-ASCII character"), which costs a full CI round to
      # diagnose. Check the shape here instead. The value is never printed.
      - name: Check the eval credential is well-formed
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          token="$CLAUDE_CODE_OAUTH_TOKEN"
          # Count characters outside the printable-ASCII range rather than
          # grepping for them: grep treats a trailing newline as a line
          # terminator, so the most likely paste mistake would slip through.
          stray=$(printf '%s' "$token" | LC_ALL=C tr -d '!-~' | wc -c | tr -d ' ')
          if [ "$stray" -ne 0 ]; then
            # Do NOT suggest a filter pipe here. A `tr -cd`-style filter
            # silently reshapes whatever it is handed into something that
            # merely looks like a token -- including a clipboard holding
            # ordinary prose -- which costs a full CI round and produces a
            # misleading "401 Invalid bearer token" instead of a paste error.
            # Verify first, store second, and never transform in between.
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN contains whitespace or a non-printable/non-ASCII character. Re-set it by running 'claude setup-token', copying ONLY the token, then verifying it before storing: CLAUDE_CODE_OAUTH_TOKEN='<paste>' claude -p 'say ok' --max-turns 1 && gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo <owner>/<repo> (paste at the prompt; no pipes, no filters)."
            exit 1
          fi
          printf '%s' "$token" | wc -c | xargs -I{} echo "Token looks well-formed ({} characters, value not printed)."

      - uses: actions/setup-node@v4
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}

      # `claude plugin eval` refuses to run a case with a shell grant unless it
      # can confine that shell. On Linux the sandbox backend is bubblewrap plus
      # socat. Ubuntu 24.04 runners also restrict the unprivileged user
      # namespaces bubblewrap relies on, so lift that restriction and prove the
      # sandbox starts before any paid eval run.
      - name: Install the Claude Code sandbox backend
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          socat -V | head -1
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true
          echo "sandbox backend OK"

      # Every eval run spends the owner's Claude plan quota, which this
      # session's own work shares; a full suite ran it out mid-run on PR #50,
      # and again on #86 once every engine PR was running it by default.
      # A PR runs only the cases for the skills it touches (by tag -- see
      # scripts/select-eval-tags.js); hooks/ and .claude-plugin/ still run
      # them all, since either changes how every skill triggers. The engine
      # (src/, bin/, schema/, package*.json, the two CI scripts, this
      # workflow) runs nothing on its own -- it opts in with the run-evals
      # label or a manual dispatch, checked below and passed to the script
      # explicitly rather than looked up from the GitHub API.
      #
      # workflow_dispatch has no PR and so no base ref to diff against;
      # BASE_REF is empty in that case and the diff is skipped entirely.
      - name: Select eval cases for this PR
        id: select
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          FULL_SUITE_OPT_IN: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-evals')) }}
        run: |
          if [ -n "$BASE_REF" ]; then
            changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          else
            changed=""
          fi
          echo "Changed paths:"
          echo "$changed" | sed 's/^/  /'
          full_suite_flag=""
          if [ "$FULL_SUITE_OPT_IN" = "true" ]; then
            echo "Full-suite opt-in: run-evals label or manual dispatch"
            full_suite_flag="--full"
          fi
          selection="$(printf '%s\n' "$changed" | node scripts/select-eval-tags.js $full_suite_flag)"
          if [ "$selection" = "all" ]; then
            echo "Eval selection: full suite"
            echo "filter=" >> "$GITHUB_OUTPUT"
          elif [ "$selection" = "none" ]; then
            echo "Eval selection: no skill touched; skipping evals"
            echo "filter=none" >> "$GITHUB_OUTPUT"
          else
            echo "Eval selection: --tag $selection"
            echo "filter=--tag $selection" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        # Pinned to the exact version this plugin was verified against
        # locally (`claude --version`) -- confirmed published at
        # https://registry.npmjs.org/@anthropic-ai/claude-code/2.1.272.
        run: npm i -g @anthropic-ai/claude-code@2.1.272

      # continue-on-error, because the GUARD is the gate, not this step.
      # `claude plugin eval` exits non-zero whenever cases scored under the
      # threshold -- including when every one of them died on a plan limit
      # and scored zero without running. Failing the job here skipped the
      # guard entirely, so the INCONCLUSIVE outcome added in #70 could never
      # be reached in exactly the case it was written for: on PR #72, 43
      # runs errored, every one of them on the session limit, and the job
      # still reported a plain red failure.
      #
      # Nothing is loosened by this. The guard below runs on the results and
      # fails the job itself, and a run that produced no results.json at all
      # (a bad argument, a sandbox that would not start) reaches it as "zero
      # cases", which is fatal there.
      - name: Run skill evals
        continue-on-error: true
        id: evals
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' && steps.select.outputs.filter != 'none' }}
        # --allow-tools "Bash(node:*)": narrow operator grant so the
        # output-correctness cases can actually invoke the sequentdraw CLI --
        # every skill invokes it as `node <literal plugin root>/bin/sequentdraw ...`,
        # optionally fed by `printf '%s' '<json>' |` (see
        # skills/*/references/cli-pipeline.md), never anything else through
        # Bash. A variable in the program path, a heredoc or `cd ... &&` is
        # refused under this grant (issue #51).
        # --ablation none: the no-plugin baseline arm cannot run sequentdraw at
        # all, so for the output cases it only burns turns and budget toward
        # the cost cap. Triggering causality was measured locally (skills fire
        # on every trigger prompt, never on the no-trigger prompts); run a
        # with-without comparison manually when descriptions change.
        # --keep-temp: each run's transcript is written to a temp directory
        # recorded as `tracePath` in results.json. Without this the directory
        # is cleaned up, so a failing output grader ("pattern not found in
        # trace") leaves no way to see what the model actually did, and the
        # next step has nothing to collect.
        # --scaffold: each run starts in an EMPTY workspace, so a case's
        # fixture is unreachable unless its case.yaml scaffold_script runs
        # first -- the two output cases' fixture/ directories, and the map
        # the three doc-map trigger prompts say already exists.
        # --trust-plugin does NOT imply this flag. It executes
        # author-supplied bash outside the agent's sandbox, which is safe
        # here only because this repository owns the suite -- every
        # scaffold script does nothing but copy a file already committed to
        # this repository into the run's workspace.
        # --concurrency 4: the suite ran one agent at a time and took 80+
        # minutes. Four in flight share the same rate limit, so this cuts wall
        # time, not quota. Results keep case order, and neither the guard nor
        # the trace collection below depends on run order (both key on case
        # name, arm and run index).
        # --max-cost-usd 50: owner-approved after PR #50's full suite with the
        # step 7 cases (the cap is checked before each run launches).
        # The selection filter (--tag <skill...>) goes last: --tag is variadic
        # and would swallow any option after it.
        env:
          EVAL_FILTER: ${{ steps.select.outputs.filter }}
        run: |
          # shellcheck disable=SC2086 -- EVAL_FILTER is intentionally split into words
          claude plugin eval . \
            --trust-plugin \
            --scaffold \
            --no-publish \
            --ablation none \
            --allow-tools "Bash(node:*)" \
            --json results.json \
            --keep-temp \
            --threshold 0.8 \
            --concurrency 4 \
            --max-cost-usd 50 \
            $EVAL_FILTER

      # A run that never really executed -- a rejected credential, a sandbox
      # that would not start, a plan usage limit -- scores as a pass on every
      # "must not trigger" grader. scripts/eval-results-guard.js (tested in
      # tests/eval-ci-scripts.test.js) fails the job for those. It tolerates a
      # run that took a turn and stopped at its own case limit, except in a
      # must-not-fire case (a grader with max: 0), where only "Reached maximum
      # number of turns (N)" with turns >= N is tolerated: the other skill
      # fired and used every turn, which is a full real run. A results file
      # with zero cases also fails.
      #
      # Exit 2 is the guard's third outcome, INCONCLUSIVE: the runs never
      # started, for an account or infrastructure reason (issue #68). The job
      # still fails -- a PR cannot merge on evidence that does not exist --
      # but it says so in terms nobody can mistake for a regression, because
      # the reflex "the evals are flaky, merge anyway" is the one thing worse
      # than a red job.
      - name: Fail on errored eval runs
        if: ${{ always() && env.CLAUDE_CODE_OAUTH_TOKEN != '' && steps.select.outputs.filter != 'none' }}
        run: |
          set +e
          node scripts/eval-results-guard.js results.json
          status=$?
          set -e
          # The eval step is allowed to fail (see above); the guard decides.
          # But a guard that is happy while the eval command itself failed
          # for a reason the results cannot show must not turn that into a
          # pass, so its outcome is carried through here.
          if [ "$status" -eq 0 ] && [ "${{ steps.evals.outcome }}" = "failure" ]; then
            echo "::error::every eval run is evidence, but the eval command itself failed; treating that as a failure."
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            {
              echo "## Skill evals: INCONCLUSIVE"
              echo
              echo "The suite did not get to judge this change: one or more runs never"
              echo "started for an account or infrastructure reason (a plan limit, a rate"
              echo "limit, a rejected credential)."
              echo
              echo "**This is not a regression and not a product failure.** Re-run this job"
              echo "once the limit resets, and read the verdict from that run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # A failing output grader reports only "pattern not found in trace",
      # which says nothing about why. The transcripts live outside the
      # workspace (see --keep-temp above), so copy each one in before the
      # upload, named by case and run. Runs on failure too -- that is the
      # case that needs them.
      - name: Collect eval traces
        if: ${{ always() && env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          let r;
          try { r = require('./results.json'); } catch { console.log('no results.json; nothing to collect'); process.exit(0); }
          const dest = 'evals/results/traces';
          fs.mkdirSync(dest, { recursive: true });
          let copied = 0, missing = 0;
          for (const c of r.cases || []) {
            for (const [arm, runs] of Object.entries(c.arms || {})) {
              (runs || []).forEach((run, i) => {
                const src = run.tracePath;
                if (!src) return;
                if (!fs.existsSync(src)) { missing++; return; }
                fs.copyFileSync(src, path.join(dest, \`\${c.name}.\${arm}.\${i}.jsonl\`));
                copied++;
              });
            }
          }
          console.log(\`collected \${copied} trace(s); \${missing} no longer on disk\`);
          "

      - name: Upload eval results
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-results
          # The aggregate JSON plus the per-run report, so a failing case can be
          # diagnosed from CI without re-running evals locally.
          path: |
            results.json
            evals/results/
          if-no-files-found: warn
