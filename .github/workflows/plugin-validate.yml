name: plugin-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Claude Code
        # Pinned to the exact version this plugin was verified against
        # locally (`claude --version`) -- confirmed published at
        # https://registry.npmjs.org/@anthropic-ai/claude-code/2.1.272.
        run: npm i -g @anthropic-ai/claude-code@2.1.272
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict
      - name: Description-length and skill-shape checks
        run: node --test tests/skill-description-length.test.js
      - name: Plugin manifest identity checks
        run: node --test tests/plugin-manifest.test.js
      - name: npm pack excludes internal tooling
        run: node --test tests/npm-pack-exclusions.test.js
      - name: Skills are self-contained (no docs/ references, links resolve)
        run: node --test tests/skill-self-contained.test.js
