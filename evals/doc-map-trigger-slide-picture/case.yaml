schema_version: "1.1"
name: doc-map-trigger-slide-picture
# Every eval run starts in an EMPTY workspace, so the map this prompt says we
# "already mapped" does not exist unless it is scaffolded in. Without it the
# prompt's own claim is false, and the traces show this case reaching outside
# the workspace into the CI checkout
# (/home/runner/work/SequentDraw/SequentDraw/examples/...) to satisfy it,
# which made the case depend on the runner's directory layout instead of its
# own fixture. Its sibling doc-map-trigger-medusa-business-svg hit the 8-turn
# limit on 3/3 runs doing the same hunt.
# The script only runs when the suite is invoked with --scaffold.
context:
  scaffold_script: fixture.sh
