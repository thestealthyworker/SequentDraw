schema_version: "1.1"
name: gitrepo-suggest-trigger-open-source-for-gap
# Every eval run starts in an EMPTY workspace, so the map this prompt says we
# "already have" does not exist unless it is scaffolded in. The premise of
# the routing decision is that a map EXISTS: without it the agent may
# reasonably route to a mapping skill instead, and the case would be
# measuring the wrong thing. The sibling business-map and doc-map cases
# record what a missing fixture costs.
# The script only runs when the suite is invoked with --scaffold.
context:
  scaffold_script: fixture.sh
